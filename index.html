<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Phonics — Listen and Repeat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Arial Rounded MT Bold", Arial, sans-serif;
    background: linear-gradient(135deg, #e5f4ff, #fff5df, #f1e7ff);
    color: #35415b;
}

header {
    text-align: center;
    padding: 22px 10px 12px;
}

h1 {
    font-size: clamp(28px, 4vw, 42px);
    color: #6758b5;
    margin: 0 0 8px;
}

.subtitle {
    font-size: 18px;
    color: #79819a;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 15px;
}

button {
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s, background .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(.96);
}

button:focus-visible {
    outline: 3px solid #6454bd;
    outline-offset: 4px;
}

/* Alphabet navigation */

.alphabet-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
}

.alphabet-button {
    width: 65px;
    height: 55px;
    border: none;
    border-radius: 16px;
    background: white;
    color: #6758b5;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 4px 0 #dcd8ed;
}

.alphabet-button.selected {
    background: #7867cc;
    color: white;
    box-shadow: 0 4px 0 #5546a2;
}

/* Main learning page */

.lesson {
    background: white;
    border-radius: 30px;
    padding: 24px;
    box-shadow: 0 8px 30px #45507815;
}

.letter-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    align-items: center;
}

.picture-area {
    background: #fff4db;
    border-radius: 25px;
    padding: 15px;
    text-align: center;
}

#associationPicture svg {
    width: 100%;
    height: 210px;
}

#associationText {
    font-size: 26px;
    font-weight: bold;
    color: #cc8050;
    margin: 10px 0;
}

.letter-info {
    text-align: center;
}

#letterTitle {
    font-size: clamp(80px, 12vw, 125px);
    font-weight: bold;
    color: #6e5dc4;
    line-height: 1.1;
}

#phonicsSound {
    font-size: 60px;
    font-weight: bold;
    color: #e96b83;
    margin-top: 8px;
}

/* Audio buttons */

.audio-controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.listen-button {
    border: none;
    border-radius: 20px;
    background: #7867cc;
    color: white;
    font-size: 21px;
    font-weight: bold;
    padding: 17px 25px;
    box-shadow: 0 5px 0 #5949a8;
}

.listen-button.playing {
    background: #e99b51;
    box-shadow: 0 5px 0 #bf7936;
    animation: pulse 1.1s infinite;
}

.stop-button {
    border: none;
    border-radius: 18px;
    padding: 15px 20px;
    background: #ffe2e9;
    color: #b45b74;
    font-size: 18px;
    font-weight: bold;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.04);
    }
}

/* Listening status */

#status {
    min-height: 32px;
    margin: 20px 0 5px;
    text-align: center;
    color: #6758b5;
    font-size: 23px;
    font-weight: bold;
}

#status.repeat {
    color: #2b9871;
    font-size: 29px;
}

#status.error {
    color: #c34d4d;
    font-size: 16px;
}

/* Vocabulary */

.divider {
    height: 2px;
    background: #efedf7;
    margin: 22px 0;
}

.words-heading {
    text-align: center;
    color: #6758b5;
    font-size: 25px;
    margin: 0 0 18px;
}

.word-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.word-card {
    text-align: center;
    padding: 22px 10px;
    border-radius: 24px;
    border: 3px solid transparent;
}

.word-card:nth-child(1) {
    background: #f1edff;
}

.word-card:nth-child(2) {
    background: #fff3d8;
}

.word-card:nth-child(3) {
    background: #e1f7eb;
}

.word-picture {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 120px;
    font-size: clamp(45px, 8vw, 85px);
    line-height: 1.3;
}

.word-picture svg {
    width: 120px;
    height: 120px;
    max-width: 100%;
}

.word-text {
    font-size: clamp(22px, 4vw, 37px);
    font-weight: bold;
    margin-top: 12px;
}

.initial {
    color: #e85d77;
}

/* Bottom navigation */

.bottom-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
}

.nav-button {
    border: none;
    border-radius: 17px;
    padding: 15px 24px;
    font-size: 18px;
    font-weight: bold;
    color: #6555b5;
    background: white;
    box-shadow: 0 4px 0 #dcd8ed;
}

.nav-button:disabled {
    opacity: .35;
    cursor: default;
    transform: none;
}

#pageNumber {
    font-size: 18px;
    font-weight: bold;
    color: #7668b8;
}

/* Mobile layout */

@media (max-width: 650px) {

    .container {
        padding: 10px;
    }

    .lesson {
        padding: 15px;
    }

    .letter-area {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    #associationPicture svg {
        height: 170px;
    }

    #letterTitle {
        font-size: 85px;
    }

    #phonicsSound {
        font-size: 48px;
    }

    .alphabet-nav {
        gap: 8px;
    }

    .alphabet-button {
        width: 52px;
        height: 48px;
    }

    .word-grid {
        gap: 7px;
    }

    .word-card {
        padding: 18px 3px;
    }

    .word-picture {
        height: 80px;
    }

    .word-picture svg {
        width: 80px;
        height: 80px;
    }

    .nav-button {
        font-size: 14px;
        padding: 13px 15px;
    }

}

@media (prefers-reduced-motion: reduce) {

    * {
        animation: none !important;
        transition: none !important;
    }

}

</style>
</head>

<body>

<header>

    <h1>🌈 ABC Phonics</h1>

    <div class="subtitle">
        Look, Listen, and Repeat!
    </div>

</header>

<main class="container">

    <nav id="alphabetNav"
         class="alphabet-nav"
         aria-label="Choose an alphabet">
    </nav>

    <section class="lesson">

        <div class="letter-area">

            <!-- Association picture -->

            <div class="picture-area">

                <div id="associationPicture"></div>

                <div id="associationText"></div>

            </div>

            <!-- Alphabet and phonics sound -->

            <div class="letter-info">

                <div id="letterTitle">A a</div>

                <div id="phonicsSound">/æ/</div>

                <div class="audio-controls">

                    <button id="listenButton"
                            class="listen-button"
                            onclick="playRecording()">

                        🔊 Listen and Repeat

                    </button>

                    <button class="stop-button"
                            onclick="stopRecording()">

                        ■ Stop

                    </button>

                </div>

            </div>

        </div>

        <div id="status"
             role="status"
             aria-live="polite">

            Ready? Let's go!

        </div>

        <div class="divider"></div>

        <h2 class="words-heading">
            Say the Words!
        </h2>

        <div id="wordGrid"
             class="word-grid">
        </div>

    </section>

    <nav class="bottom-nav">

        <button id="previousButton"
                class="nav-button"
                onclick="moveLetter(-1)">

            ◀ Previous

        </button>

        <div id="pageNumber">1 / 5</div>

        <button id="nextButton"
                class="nav-button"
                onclick="moveLetter(1)">

            Next ▶

        </button>

    </nav>

</main>

/* ======================================
   APP STATE
====================================== */

let currentIndex = 0;

let playbackId = 0;

const audio = document.getElementById("teacherAudio");

const $ = id => document.getElementById(id);


/* ======================================
   STATUS MESSAGE
====================================== */

function setStatus(message, type = "") {

    $("status").textContent = message;

    $("status").className = type;

}


/* ======================================
   ALPHABET NAVIGATION
====================================== */

function renderNavigation() {

    const nav = $("alphabetNav");

    nav.innerHTML = "";

    lessons.forEach((item, index) => {

        const button = document.createElement("button");

        button.className = "alphabet-button";

        button.textContent = item.letter;

        if (index === currentIndex) {

            button.classList.add("selected");

            button.setAttribute("aria-current", "page");

        }

        button.addEventListener("click", () => {

            selectLetter(index);

        });

        nav.appendChild(button);

    });

}


/* ======================================
   RENDER VOCABULARY
====================================== */

function renderWords() {

    const lesson = lessons[currentIndex];

    const grid = $("wordGrid");

    grid.innerHTML = "";

    lesson.words.forEach(word => {

        const card = document.createElement("div");

        card.className = "word-card";

        const picture = document.createElement("div");

        picture.className = "word-picture";

        // SVG doll or original emoji picture

        if (word.svg) {

            picture.innerHTML = word.svg;

        } else {

            picture.textContent = word.picture;

        }

        const text = document.createElement("div");

        text.className = "word-text";

        const initial = document.createElement("span");

        initial.className = "initial";

        initial.textContent = word.text.charAt(0);

        text.appendChild(initial);

        text.appendChild(
            document.createTextNode(word.text.slice(1))
        );

        card.appendChild(picture);

        card.appendChild(text);

        grid.appendChild(card);

    });

}


/* ======================================
   RENDER CURRENT LETTER
====================================== */

function renderLesson() {

    const lesson = lessons[currentIndex];

    $("letterTitle").textContent =
        lesson.letter + " " +
        lesson.letter.toLowerCase();

    $("phonicsSound").textContent =
        "/" + lesson.ipa + "/";

    $("associationText").textContent =
        lesson.association;

    $("associationPicture").innerHTML =
        pictures[lesson.letter];

    $("pageNumber").textContent =
        (currentIndex + 1) + " / " + lessons.length;

    $("previousButton").disabled =
        currentIndex === 0;

    $("nextButton").disabled =
        currentIndex === lessons.length - 1;

    audio.src = lesson.audio;

    audio.load();

    renderNavigation();

    renderWords();

    setStatus("Ready? Let's go!");

    resetListenButton();

}


/* ======================================
   AUDIO BUTTON STATE
====================================== */

function resetListenButton() {

    const button = $("listenButton");

    button.classList.remove("playing");

    button.textContent = "🔊 Listen and Repeat";

}


/* ======================================
   PLAY TEACHER RECORDING
====================================== */

async function playRecording() {

    const token = ++playbackId;

    audio.pause();

    try {

        audio.currentTime = 0;

    } catch (error) {}

    const button = $("listenButton");

    button.classList.add("playing");

    button.textContent = "🎧 Listening...";

    setStatus("Listen carefully!");

    try {

        await audio.play();

        if (token !== playbackId) {

            return;

        }

    } catch (error) {

        if (token !== playbackId) {

            return;

        }

        resetListenButton();

        setStatus(
            "오디오를 재생할 수 없어요. asset 폴더와 파일 이름을 확인해 주세요.",
            "error"
        );

    }

}


/* ======================================
   AUDIO ENDED
====================================== */

audio.addEventListener("ended", () => {

    resetListenButton();

    setStatus(
        "🗣 Your turn! 따라 말해요!",
        "repeat"
    );

    $("listenButton").textContent =
        "🔁 Listen Again";

});


/* ======================================
   AUDIO ERROR
====================================== */

audio.addEventListener("error", () => {

    resetListenButton();

    setStatus(
        decodeURIComponent(lessons[currentIndex].audio) +
        " 파일을 불러올 수 없어요.",
        "error"
    );

});


/* ======================================
   STOP RECORDING
====================================== */

function stopRecording() {

    playbackId++;

    audio.pause();

    try {

        audio.currentTime = 0;

    } catch (error) {}

    resetListenButton();

    setStatus("Ready? Let's go!");

}


/* ======================================
   SELECT LETTER
====================================== */

function selectLetter(index) {

    if (index < 0 || index >= lessons.length) {

        return;

    }

    stopRecording();

    currentIndex = index;

    renderLesson();

}


function moveLetter(direction) {

    selectLetter(currentIndex + direction);

}


/* ======================================
   KEYBOARD CONTROLS
====================================== */

document.addEventListener("keydown", event => {

    if (event.key === "ArrowLeft") {

        event.preventDefault();

        moveLetter(-1);

    }

    if (event.key === "ArrowRight") {

        event.preventDefault();

        moveLetter(1);

    }

    if (
        event.code === "Space" &&
        event.target.tagName !== "BUTTON"
    ) {

        event.preventDefault();

        if (audio.paused) {

            playRecording();

        } else {

            stopRecording();

        }

    }

    if (event.key === "Escape") {

        stopRecording();

    }

});


/* ======================================
   START APPLICATION
====================================== */

renderLesson();

</script>

</body>
</html>
